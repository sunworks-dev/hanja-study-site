<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="어흥!한자 출시를 준비하고 있습니다. 지금 웹에서 한자 학습을 시작해 보세요." />
    <meta name="theme-color" content="#fff8ed" />
    <title>어흥!한자 — 출시 준비 중</title>
    <link rel="canonical" href="https://hanja-app.sunw.kr/" />
    <link rel="icon" type="image/webp" href="/assets/hanja-icon.webp" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 48px 24px;
        background: #fff8ed;
        color: #422c23;
        font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
        text-align: center;
        word-break: keep-all;
      }
      main { width: 100%; max-width: 520px; }
      .icon { display: block; margin: 0 auto 32px; border-radius: 24px; }
      .status { margin: 0 0 12px; color: #795644; font-size: 15px; font-weight: 600; }
      h1 { margin: 0; font-size: clamp(42px, 10vw, 64px); letter-spacing: -0.055em; line-height: 1.2; }
      .description { margin: 24px 0 32px; font-size: 18px; line-height: 1.8; color: #6b5144; }
      .start {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 56px;
        padding: 16px 28px;
        border-radius: 12px;
        background: #422c23;
        color: #fff8ed;
        font-size: 17px;
        font-weight: 700;
        text-decoration: none;
      }
      .start:hover { background: #614233; }
      a:focus-visible { outline: 3px solid #a94720; outline-offset: 6px; }
      footer { margin-top: 64px; }
      footer a { display: inline-flex; align-items: center; min-height: 44px; color: #795644; font-weight: 600; text-underline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img class="icon" src="/assets/hanja-icon.webp" width="112" height="112" alt="" />
      <p class="status">출시 준비 중</p>
      <h1>어흥!한자</h1>
      <p class="description">어흥!한자의 정식 소개 페이지를 준비하고 있습니다.<br />지금은 웹에서 먼저 만나 보세요.</p>
      <a class="start" href="https://bryannamd.github.io/hanja-web/">웹에서 시작하기</a>
      <footer><a href="https://www.sunworks.kr/">sunworks</a></footer>
    </main>
  </body>
</html>
